[package]
name = "codex-shell-command"
version = "0.146.0"
edition = "2024"
license = "Apache-2.0"

# Local Kodex fork of openai/codex `codex-shell-command` (tag rust-v0.146.0).
# Patches `command_might_be_dangerous` to route shell file-write commands
# (redirection, tee/sed -i/perl -i, and scripted interpreters reading a stdin
# heredoc whose body is invisible to the parsed argv) to the ACP host's
# permission broker, so Maju's apply_patch guidance applies instead of the
# sandbox silently auto-approving in-workspace writes. Keep this in sync with
# the upstream tag when bumping `codex-shell-command` in codex-acp/Cargo.toml.

[lib]
doctest = false

[dependencies]
base64 = "0.22.1"
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.146.0" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", tag = "rust-v0.146.0" }
libc = "0.2.182"
once_cell = "1.20.2"
regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3.0"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
url = "2"
which = "8"

[dev-dependencies]
anyhow = "1"
pretty_assertions = "1.4.1"
